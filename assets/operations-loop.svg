<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">운영의 흐름을 살피고 불편을 하나씩 줄여가는 과정</title>
  <desc id="desc">관찰, 정리, 개선, 확인의 네 단계를 얇은 인프라 연결선으로 표현한 운영 흐름도</desc>

  <defs>
    <linearGradient id="infra-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8c1"/>
      <stop offset="0.55" stop-color="#6ea8fe"/>
      <stop offset="1" stop-color="#9b8afb"/>
    </linearGradient>
    <pattern id="infra-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#263141" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="24" fill="#0b0f14"/>
  <rect width="1200" height="360" rx="24" fill="url(#infra-grid)"/>

  <text x="62" y="58" fill="#67e8c1" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" font-weight="700" letter-spacing="3">DEVOPS &amp; INFRASTRUCTURE</text>
  <text x="62" y="116" fill="#e8edf5" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="39" font-weight="700">운영의 흐름을 살피고,</text>
  <text x="62" y="165" fill="#e8edf5" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="39" font-weight="700">불편을 하나씩 줄여갑니다.</text>
  <text x="62" y="205" fill="#7f8a9b" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17">반복되는 일은 정리하고, 배포한 뒤에는 다시 확인합니다.</text>

  <path d="M72 275C210 240 290 304 414 267S627 232 742 272s209 49 386-12" fill="none" stroke="#263141" stroke-width="8" opacity="0.55"/>
  <path d="M72 275C210 240 290 304 414 267S627 232 742 272s209 49 386-12" fill="none" stroke="url(#infra-line)" stroke-width="3"/>

  <g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <circle cx="165" cy="260" r="17" fill="#0b0f14" stroke="#67e8c1" stroke-width="3"/>
    <circle cx="414" cy="267" r="17" fill="#0b0f14" stroke="#72c7ea" stroke-width="3"/>
    <circle cx="742" cy="272" r="17" fill="#0b0f14" stroke="#778ff8" stroke-width="3"/>
    <circle cx="1040" cy="274" r="17" fill="#0b0f14" stroke="#9b8afb" stroke-width="3"/>
    <text x="165" y="321" fill="#e8edf5" font-size="17" text-anchor="middle">관찰</text>
    <text x="414" y="321" fill="#e8edf5" font-size="17" text-anchor="middle">정리</text>
    <text x="742" y="321" fill="#e8edf5" font-size="17" text-anchor="middle">개선</text>
    <text x="1040" y="321" fill="#e8edf5" font-size="17" text-anchor="middle">확인</text>
  </g>

  <path d="M1068 44h38m-19-19v38M1114 102h24m-12-12v24" stroke="#263141" stroke-width="2"/>
  <rect x="992" y="81" width="34" height="24" rx="4" fill="none" stroke="#263141" stroke-width="2"/>
  <path d="M999 89h20M999 96h12" stroke="#263141" stroke-width="2"/>
</svg>
